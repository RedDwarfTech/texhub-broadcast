name: texhub-broadcast-npm-publish

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build React App
        run: |
          npm ci
          npm run build
        env:
          CI: false
      - uses: JS-DevTools/npm-publish@v4
